pipeline_version: extraction-v3
status: CANDIDATE
router_policy_version: router_frozen_v1
reconciliation_version: reconciliation_v2.1
template_versions:
  cms1500: '03'
  ub04: '2014'
ocr_models:
  primary:
    engine: PaddleOCR
    model: PP-OCRv4
    runtime: paddleocr-2.x
    role: Governed primary OCR (CMS-1500 routes)
  confirmation:
    engine: RapidOCR
    model: rapidocr-onnx
    role: Independent E2 confirmation vs paddle
  fill:
    engine: Tesseract
    model: field-specific-psm / CHARGE_DIGITS
    runtime: external
    role: Fill on miss; single-engine charge tess before gpt-4o
  residual_handwriting_and_charge:
    engine: Azure-gpt-4o-crop
    model: gpt-4o
    authority: SHAPED_ACCEPT_WITH_LOCAL_CONSENSUS
    monetary_authority: false
    role: >
      Name conflict arbitrator; empty box-28 line-sum corroboration
      (SINGLE_LINE_GPT4O_LOCAL). Never gpt-only critical AUTO (redesign-stack-v1).
  fixed_form_printed:
    engine: OpenOCR-SVTRv2
    default: off
    env: CDP_OPENOCR_SVTR
    role: Primary printed dates/IDs/monetary crops when enabled; else paddle+rapid.
  complex_tables:
    engines: [PaddleOCR-VL, MonkeyOCR]
    default: off
    authority: REVIEW_ONLY
  architecture_stack: config/architecture/redesign_stack_v1.yaml
  handwriting_local:
    engine: TrOCR
    model: microsoft/trocr-base-handwritten
    runtime: transformers-4.x
    authority: REVIEW_ONLY_UNTIL_DOMAIN_HOLDOUT_PROMOTION
    role: Optional DOB residual before gpt-4o
  attachment_printed:
    engine: TrOCR
    model: microsoft/trocr-base-printed
    authority: REVIEW_ONLY
  azure_di_charge:
    engine: Azure-Document-Intelligence
    model: prebuilt-read
    default: off
    env: CDP_AZURE_DI_CHARGE_RESIDUAL
    note: Not on recommended stack (F0 thrash); gpt-4o+local preferred.
  ppocr_v5_server:
    engine: PaddleOCR
    model: PP-OCRv5_server
    runtime: paddleocr-3.x-isolated-venv
    default: off
    env: CDP_PPOCRV5_SERVER
    note: Same PADDLE_FAMILY as primary; empty on hard charge residuals.
  optional_layout:
    engine: Docling
    status: PILOT_DISABLED
