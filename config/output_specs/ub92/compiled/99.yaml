    Assignment X 87X - Reserved for National Assignment X 88X - Reserved for National
    Assignment X 89X - Other X Exhibit # 4 Type and Source of Admission and Patient
    Status Type of Admission 1 – Emergency - Admissions deemed to be immediately necessary
    for the health and safety of the patient. i.e. admission is required because irreversible
    damage to limbs or body functions is imminent. 2 – Urgent - Admissions deemed
    to be immediately necessary within a time span of no longer than 5 days from determining
    the need for hospitalization. This delay will not result in a significant change
    in the patient’s status or harm to the patient. 3 – Elective - Admissions in which
    no significant risk or health hazard to the patient is apparent should the admission
    be scheduled beyond the 5 day period (see Urgent Admission above). This does not
    preclude elective admissions from being admitted to the hospital in a time span
    of less than 5 days. 4 – Newborn - A baby born within this facility. If this code
    is used, must use the special Source of Admission codes. 5 – 8 Reserved for National
    Assignment. 9 Information not available. Source of Admission (for Emergency, Elective
    or Other Type of Admission) 1 - Physician Referral Inpatient: The patient was
    admitted to this facility on the recommendation of his/her personal physician.
    Outpatient: The patient was referred to this facility for outpatient or diagnostic
    services by his/her personal physician or the patient independently requested
    outpatient services (self-referral). 2 - Clinic Referral Inpatient: The patient
    was admitted to this facility on the recommendation of this facility’s clinic
    physician. Outpatient: The patient was referred to this facility for outpatient
    or diagnostic services by this facility’s clinic or other outpatient department
    physician. 3 - HMO Referral Inpatient: The patient was admitted to this facility
    on the recommendation of a HMO physician. Outpatient: The patient was referred
    to this facility for outpatient or diagnostic services by a HMO. 4 - Transfer
    From A Hospital Inpatient: The patient was admitted as a transfer from an acute
    care facility where he/she was an inpatient. Outpatient: The patient was referred
    to this facility for outpatient or diagnostic services by a physician of another
    acute care facility. 5 - Transfer From A Skilled Nursing Facility Inpatient: The
    patient was admitted as a transfer from a skilled nursing facility where he/she
    was an inpatient. Outpatient: The patient was referred to this facility for outpatient
    or diagnostic services by a physician of the skilled nursing facility where he/she
    was an inpatient. 6 - Transfer From Another Health Care Facility Inpatient: The
    patient was admitted to this facility as a transfer from a health care facility
    other than an acute facility or a skilled nursing facility Outpatient: The patient
    was referred to this facility for outpatient or diagnostic services by a physician
    of) another health care facility where he/she is an inpatient. 7 - Emergency Room
    Inpatient: The patient was admitted on the recommendation of the facility’s emergency
    room physician. Outpatient: The patient was referred to this facility for outpatient
    or diagnostic services by the facility’s emergency room physician. 8 - Court/Law
    Enforcement Inpatient: The patient was admitted to this facility on the direction
    of a court of law, or on the request of a law enforcement agency representative.
    Outpatient: The patient was referred to this facility on the direction of a court
    of law, or on the request of a law enforcement agency representative for outpatient
    or referenced diagnostic services. 9 - Information Not Available Inpatient: The
    means by which the patient was admitted to this hospital is not known. Outpatient:
    The means by which the patient was referred to this facility is not known. A -
    Transfer From A Critical Access Hospital Inpatient: The patient was admitted as
    a transfer from a Critical Access Hospital where he/she was an inpatient. Outpatient:
    The patient was referred to this facility for outpatient diagnostic services by
    (a physician of) the Critical Access Hospital where he or she was an inpatient.
    B - Z Reserved for National Assignment. Admission Source (for Newborn) 1 - Normal
    Delivery - A baby delivered with complications. 2 - Premature Delivery - A baby
    delivered with time and/or weight factors qualifying it for premature status.
