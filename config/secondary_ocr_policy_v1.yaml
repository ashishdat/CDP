version: secondary-ocr-policy-v1
routes:
  NUMERIC: {primary: RAPID, secondary: TESSERACT, invoke_when: VALIDATION_FAILED}
  DATE: {primary: RAPID, secondary: TESSERACT_CONSTRAINED, invoke_when: VALIDATION_FAILED}
  ALPHANUMERIC_ID: {primary: RAPID, secondary: TESSERACT, invoke_when: VALIDATION_FAILED}
  TAX_IDENTIFIER: {primary: RAPID, secondary: TESSERACT, invoke_when: VALIDATION_FAILED}
  CPT_HCPCS: {primary: RAPID, secondary: TESSERACT, invoke_when: VALIDATION_FAILED}
  ICD_CODE: {primary: RAPID, secondary: TESSERACT, invoke_when: VALIDATION_FAILED}
  PERSON_NAME: {primary: RAPID, secondary: PADDLE, invoke_when: VALIDATION_FAILED}
  PERSON_OR_ORGANIZATION: {primary: RAPID, secondary: PADDLE, invoke_when: VALIDATION_FAILED}
  ADDRESS: {primary: RAPID, secondary: PADDLE, invoke_when: VALIDATION_FAILED}
  CHECKBOX: {primary: OPENCV, secondary: NONE, invoke_when: NEVER}
  TABLE: {primary: TOKEN_GEOMETRY, secondary: REGIONAL_OCR, invoke_when: ROW_UNRESOLVED}
cloud_common_path_enabled: false  # never on common path
# Prefer local TrOCR for DOB handwriting residuals; Azure DI is fallback only.
trocr_enabled: true
trocr_invoke_when: LOCAL_OCR_EXHAUSTED_OR_HANDWRITING_RESIDUAL
trocr_review_only_until_promoted: false  # date-shaped TrOCR may accept (local)
# Catastrophic registration: cheap local first; Azure DI last (billable).
document_quad_recovery_enabled: true
learned_matcher_enabled: true
# Full-page Azure DI corners are billable — off by default; enable per-run via
# CDP_AZURE_DI_PAGE_CORNERS=1 when local quad+LightGlue still fail.
registration_azure_di_corners_enabled: false
registration_vlm_corners_enabled: false
# Azure Document Intelligence Read remains available after TrOCR miss.
azure_document_intelligence_enabled: true
azure_document_intelligence_invoke_when: LOCAL_OCR_EXHAUSTED_AFTER_TROCR_OR_REGISTRATION_CORNERS
azure_document_intelligence_model: prebuilt-read
# DOB crop residual may accept locally via TrOCR; Azure DI crop stays review-only.
azure_document_intelligence_review_only_until_promoted: true
textract_enabled: true
textract_invoke_when: LOCAL_OCR_EXHAUSTED_AND_BLOCKS_STP_AFTER_AZURE_DI
textract_api: DetectDocumentText
azure_ai_cascade_enabled: true
azure_invoke_when: HANDWRITING_OR_ORIENTATION_AFTER_TROCR_AND_AZURE_DI
azure_review_only_until_promoted: true
docling_categories: [DIFFICULT_TABLE, EOB, ITEMIZED_BILL, MEDICAL_INVOICE]
