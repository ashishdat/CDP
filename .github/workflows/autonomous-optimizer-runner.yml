name: autonomous-optimizer-runner

on:
  push:
    branches: [autonomous/cdp-optimization]
  pull_request:

permissions:
  contents: read

jobs:
  manifest-runner:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - run: python -m ruff check evaluation/autonomous_optimizer_runner.py tests/unit/cases/test_autonomous_optimizer_runner.py
      - run: python -m mypy --follow-imports=skip --ignore-missing-imports evaluation/autonomous_optimizer_runner.py
      - run: python -m pytest -q tests/unit/cases/test_autonomous_optimizer_runner.py -p no:cacheprovider --basetemp="${RUNNER_TEMP}/autonomous-optimizer-runner"
