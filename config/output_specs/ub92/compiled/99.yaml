  description: 'UB-92 EXHIBITS Exhibit # 1 Standard Date and Time Checks Format Rules
    Date fields are depicted as CCYYMMDD unless otherwise stated, such as Patient
    Birthdate which is depicted as MMDDCCYY, where: MM = Month DD = Day CC = Century
    YY = Year Validation Rules Month (MM) Must contain a value of 01 - 12. Day (DD)
    Must contain a value of 01 - 31 based on the Month entered: Month (MM) Day (DD)
    04, 06, 09, 11 01 thru 30 01, 03, 05, 07, 08, 10, 12 01 thru 31 02 01 thru 29
    Century (CC) Must contain a value of 19 or 20 for miscellaneous dates. May contain
    a value of 18, 19 or 20 for date of birth fields. Year (YY) May contain a value
    of 00 thru 99. Time Code Structure Code Time A.M. Code Time P.M. 00 12:00 - 12:59
    Midnight 12 12:00 - 12:59 Noon 01 01:00 - 01:59 13 01:00 - 01:59 02 02:00 - 02:59
    14 02:00 - 02:59 03 03:00 - 03:59 15 03:00 - 03:59 04 04:00 - 04:59 16 04:00 -
    04:59 05 05:00 - 05:59 17 05:00 - 05:59 06 06:00 - 06:59 18 06:00 - 06:59 07 07:00
    - 07:59 19 07:00 - 07:59 08 08:00 - 08:59 20 08:00 - 08:59 09 09:00 - 09:59 21
    09:00 - 09:59 10 10:00 - 10:59 22 10:00 - 10:59 11 11:00 - 11:59 23 11:00 - 11:59
    99 Hour Unknown Exhibit # 2 Standard Address Checks Address-1, Address-2 May contain
    the following values: A - Z 0 - 9 space comma (,) period (.) ampersand (&) pound
    sign (#) forward slash (/) No other special characters are allowed. City May contain
    the following values: A - Z 0 - 9 space comma (,) period (.) ampersand (&) pound
    sign (#) forward slash (/) No other special characters are allowed. Must be at
    least 2 characters in length. State Must be a valid United States Post Office
    code. ZIP Code If the state is within the United States, the first three digits
    of the Zip Code must be within the state range. If the state is a U.S. Territory
    (i.e. Virgin Islands) or a foreign country, the Zip Code may contain any value.
    If all nine digits are known, enter all nine digits. If all nine digits are not
    known: ▪ The first five positions must contain the Zip Code. ▪ The last four positions
    must contain zeros or spaces; however, zeros are preferred. Exhibit # 3 Batch
    and Bill Type Codes The Batch and Bill Type Code is a three position code containing
    the following: Information Position Type of Facility 1 Bill Classification 2 Frequency
    3 Type of Facility/Bill Classification 1XX - Hospital 11X - Inpatient (including
