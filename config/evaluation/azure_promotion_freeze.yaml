freeze_version: azure-gpt4o-route-freeze-v1
status: FROZEN_FOR_HOLDOUT
provider: AZURE_OPENAI
deployment: gpt-4o
model_version: deployment-managed-gpt-4o
api_version: "2024-10-21"
prompt_version: crop-field-extraction-v1
prompt_policy:
  temperature: 0
  strict_json_schema: true
  do_not_guess: true
  insufficient_evidence_required: true
crop_policy:
  version: unresolved-regional-crops-v1
  full_pages_allowed: false
  unresolved_fields_only: true
  preserve_original_crop: true
  crop_hash_required: true
normalization_policy: config/evaluation/normalization_rules.yaml
validation_policy: config/evaluation/table_promotion_v3.yaml
reconciliation_policy:
  version: azure-review-reconciliation-v1
  candidate_authority: REVIEW_ONLY
  global_promotion_allowed: false
  critical_fields_require_reference_or_human: true
holdout:
  minimum_eligible_fields: 300
  new_document_hashes_only: true
  inference_before_labeling: true
  required_writing_types: [PRINTED, HANDWRITTEN]
  required_crop_conditions: [VALID, BLANK, CLIPPED, INVALID]
  required_criticalities: [CRITICAL, NONCRITICAL]
  minimum_document_families: 3
promotion_gate:
  selective_accuracy_minimum: 0.99
  critical_false_accepts_maximum: 0
  invalid_crop_abstention_minimum: 1.0
  provenance_completeness_minimum: 1.0
  leakage_violations_maximum: 0
  incremental_recovery_minimum_exclusive: 0
  extraction_v2_regressions_maximum: 0
  cost_per_avoided_review_must_be_below_reviewer_cost: true
rollout:
  promotion_scope: FIELD_FAMILY_ROUTE_ONLY
  initial_canary_fraction: 0.05
  immediate_rollback_required: true
