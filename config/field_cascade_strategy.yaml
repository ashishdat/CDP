# Field-cascade OCR strategy — operational CMS-1500 STP
#
# Version field-cascade-v9 consolidates past learning into one architecture:
# dual-engine confirmation (paddle+rapid), agreement-aware candidate pick,
# Track A/B HITL separation, and honest accuracy (unavailable without GT).
# Closes residual v8 Track-B walls: confirmation text ignored when primary
# is header bleed; insured_id calibration near-misses with multi-engine agree.
#
version: field-cascade-v9
status: ACTIVE
phase: 9
supersedes: field-cascade-v8

# Pipeline stages (ops path). Later stages must not invent ink.
stages:
  - id: register
    role: Emit RegistrationReport / RegistrationEvidence (E3 source of truth).
  - id: register_recovery
    role: Cause-specific enhance then optional contrast-stretch second preprocess; same template/gates.
  - id: geometry
    role: Bind template ROIs; embed registration_ref + acceptance on GeometryResult.
  - id: roi_inset
    role: Shrink DOB/charge windows inside the safe cell (no re-registration).
  - id: crop_ladder
    role: Typed crop variants ordered per field (digit-band, year-wide, NPI-cleared).
  - id: route_engines
    role: >
      Governed engines from ocr_field_routes.yaml. OCRRouter requires two usable
      OBSERVED engines (primary + confirmation) before short-circuit; fill
      (tesseract) only after confirmation ladder.
  - id: tesseract_fill
    role: >
      When paddle+rapid return usable but unshaped text, explicitly run tesseract
      on the same crop and re-pick — ensures fill engine is exercised and OBSERVED.
  - id: engine_agreement
    role: >
      Among dual-engine candidates, prefer span-normalized multi-engine agreement;
      else first field-shaped value in route order. Never invent glyphs.
  - id: span_select
    role: Always span-select observed text before accept (even when OCR non-empty).
  - id: semantic_accept
    role: Stop only on field-shaped values (DATE / CURRENCY / NAME / ID).
  - id: post_miss
    role: Declared fallbacks after cascade miss (e.g. DOB cell OCR) — still observed ink only.
  - id: service_lines
    role: Probe service-line charges; skip header rows; currency can prove liveness.
  - id: assemble
    role: ExtractionResult must reference registration + geometry + ocr artifacts.
  - id: complete_e3
    role: Attach TEMPLATE_REGISTRATION_CONFIRMED (E3) from RegistrationReport/Geometry.
  - id: completion_e6
    role: LINE_TOTALS_RECONCILED when box-28 empty + observed line charges (not invented).
  - id: decide
    role: True STP only when critical evidence classes are complete; else Track-B HITL.
  - id: gap_taxonomy
    role: Classify residual ink gaps only after evidence-complete decision.
  - id: metrics
    role: >
      Report accuracy (UNAVAILABLE without GT), true STP, Track-A registration HITL,
      Track-B field-ink HITL, OCR cascade health, and the same rollups by_group / by_bundle.

honesty:
  - Never invent DOBs or amounts; empty / unreadable ink → HITL.
  - No identity-policy softening to chase STP rate.
  - Glyph repair only on observed confusables (e.g. I/00 → 100.00, 983 → 1983).
  - True STP = FinalClaim completed AND review_required=false.
  - Residual handwriting with header-only OCR stays HITL (scan/ROI / handwriting model / human).
  - Missing E3 / engine-authority strip is evidence-plumbing, never HANDWRITING_UNREADABLE.
  - DATE_VALID + HARD_VALIDATION may relieve calibrated floor; never waive E3.
  - Multi-engine ID agreement + HARD_VALIDATION may relieve C3 floor to 0.95 (corroboration).
  - Report registration HITL and field-ink HITL as separate tracks.
  - Hackathon 1000 has no field GT — accuracy status UNAVAILABLE_NO_GROUND_TRUTH.

defaults:
  engine_source: config/ocr_field_routes.yaml
  stop_on: semantic_accept
  exhaust_action: keep_best_nonempty_or_empty
  always_span_select: true
  confirmation_required_usable: 2
  prefer_multi_engine_agreement: true
  e3_sources:
    - registration_report.json
    - document.json
    - geometry_field_registration

# Maps strategy ladder ids → CropVariant.variant_id produced by crop_variants().
crop_id_aliases:
  primary: primary
  dob_digit_band: dob_digit_band
  dob_loose: dob_loose
  dob_year_wide: dob_year_wide
  charge_npi_cleared: charge_npi_cleared
  charge_taller: charge_taller
  name_value_band: name_value_band
  id_value_band: id_value_band
  charges_primary: charges_primary
  charges_mid: charges_mid
  charges_right: charges_right
  charges_far_right: charges_far_right

fields:
  patient_dob:
    crop_ladder: [primary, dob_digit_band, dob_loose, dob_year_wide]
    accept: DATE_SHAPED
    post_miss: [dob_cells]
    notes: >
      Trailing-1 MM/DD peel; header-safe compact; MMDDYYY century repair;
      dob_cells attributed to producing route engine; prefer paddle∩rapid agree.
  total_charge:
    crop_ladder: [primary, charge_npi_cleared, charge_taller]
    accept: CURRENCY_SHAPED
    reject: [CURRENCY_LEADING_MINUS, CURRENCY_SUSPICIOUS_TINY, EMPTY]
    completion: [LINE_TOTALS_RECONCILED]
    notes: Currency confusable repair on observed glyphs; line-sum when box-28 empty.
  patient_name:
    crop_ladder: [primary, name_value_band]
    accept: NAME_SHAPED
  insured_name:
    crop_ladder: [primary, name_value_band]
    accept: NAME_SHAPED
  insured_id_number:
    crop_ladder: [primary, id_value_band]
    accept: ID_SHAPED
    notes: Multi-engine agreement + HARD_VALIDATION → C3 floor 0.95 corroboration.
  charges:
    crop_ladder: [charges_primary, charges_mid, charges_right, charges_far_right]
    accept: CURRENCY_SHAPED

# Residual HITL taxonomy (honest classification — not auto-accept paths).
gap_classes:
  EVIDENCE_PLUMBING_GAP:
    action: Fix artifact contracts (attach E3/E6 / engine authority); do not treat as ink failure.
  REGISTRATION_HITL:
    action: Registration recovery ladder or human registration; field cascade not applicable.
  HANDWRITING_UNREADABLE:
    action: Keep HITL; needs scan/ROI quality, handwriting model, or human entry.
  AMBIGUOUS_DIGIT_FRAGMENTS:
    action: Prefer crop/span repair; HITL if no unique calendar-valid date.
  CALIBRATION_HITL:
    action: Calendar-valid / format-valid value held for calibrated confidence; corroboration relief or HITL.
  EMPTY_FINANCIAL_INK:
    action: Keep HITL unless LINE_TOTALS_RECONCILED from observed service-line charges.
  NPI_CONTAMINATED_CHARGE:
    action: Keep empty / HITL; never accept $1.00 NPI bleed as claim total.
