name: docker

on:
  push:
    branches: [main, feature/cdp-v3]
    paths:
      - "Dockerfile"
      - "deploy/docker/**"
      - "docker-compose*.yml"
      - "packages/**"
      - "apps/**"
      - "workers/**"
      - "pyproject.toml"
      - ".github/workflows/docker.yml"
  pull_request:
    paths:
      - "Dockerfile"
      - "deploy/docker/**"
      - "docker-compose*.yml"
      - "pyproject.toml"
      - ".github/workflows/docker.yml"
  workflow_dispatch:

jobs:
  build-app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build cdp-app
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/docker/app.Dockerfile
          push: false
          tags: cdp-app:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build-routing:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build cdp-routing
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/docker/routing.Dockerfile
          push: false
          tags: cdp-routing:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # OCR image is large (Paddle); build on workflow_dispatch or main only.
  build-ocr:
    if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build cdp-ocr
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/docker/ocr.Dockerfile
          push: false
          tags: cdp-ocr:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
