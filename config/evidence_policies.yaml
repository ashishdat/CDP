version: evidence-policy-v4-dependency-aware
defaults:
  C0: {accept_any: [[E1, E3, E4]]}
  C1: {accept_any: [[E1, E3, E4], [E1, E3, E5], [E1, E3, E4, E7]]}
  C2: {accept_any: [[E2, E3, E4], [E1, E3, E6], [E1, E3, E5]]}
  C3: {accept_any: [[E2, E3, E4], [E1, E3, E6], [E1, E3, E5]]}
fields:
  provider_name:
    accept_any: [[E2, E3, E4], [E1, E3, E5], [E1, E3, E6]]
    require_field_specific_e3: true
    require_strong_e4: true
  insured_name:
    accept_any: [[E2, E3, E4], [E1, E3, E4], [E1, E3, E5], [E1, E3, E6]]
    require_field_specific_e3: true
    require_strong_e4: false
    allowed_e6_types:
      - MULTI_ATTRIBUTE_IDENTITY_CONFIRMED
      - MEMBER_IDENTITY_CONSISTENT
      - MEMBER_RELATIONSHIP_CONFIRMED
      - DOB_SERVICE_DATE_CONSISTENT
  relationship:
    accept_any: [[E2, E3, E4], [E1, E3, E4], [E1, E3, E5], [E1, E3, E6]]
    require_field_specific_e3: true
    require_strong_e4: true
  service_date:
    accept_any: [[E2, E3, E4], [E1, E3, E5]]
    require_field_specific_e3: true
    require_strong_e4: true
  rendering_provider_npi: {accept_any: [[E2, E3, E4], [E1, E3, E5], [E1, E3, E4, E7]]}
  billing_provider_npi: {accept_any: [[E2, E3, E4], [E1, E3, E5], [E1, E3, E4, E7]]}
  provider_npi: {accept_any: [[E2, E3, E4], [E1, E3, E5], [E1, E3, E4, E7]]}
  member_id:
    accept_any: [[E2, E3, E4], [E1, E3, E4], [E1, E3, E5], [E1, E3, E6]]
    allowed_e6_types:
      - MULTI_ATTRIBUTE_IDENTITY_CONFIRMED
      - MEMBER_IDENTITY_CONSISTENT
      - MEMBER_RELATIONSHIP_CONFIRMED
      - DOB_SERVICE_DATE_CONSISTENT
  CMS1500.insured_id_number:
    accept_any: [[E2, E3, E4], [E1, E3, E4], [E1, E3, E5], [E1, E3, E6]]
    require_strong_e4: false
    allowed_e6_types:
      - MULTI_ATTRIBUTE_IDENTITY_CONFIRMED
      - MEMBER_IDENTITY_CONSISTENT
      - MEMBER_RELATIONSHIP_CONFIRMED
      - DOB_SERVICE_DATE_CONSISTENT
  patient_dob:
    accept_any: [[E2, E3, E4], [E1, E3, E4], [E1, E3, E4, E6], [E1, E3, E5], [E1, E3, E4, E7]]
    require_strong_e4: false
  patient_name:
    # Dual local-engine confirmation (paddle+rapid) is the identity confirm.
    # Correlated same-crop agreement still does not mint independent E2.
    # Format-valid E4 is enough once E2 is truly independent (same as insured_name).
    # Non-Self Box 2 may use BOX2_INDEPENDENT_NAME_AUTHORITY when disagreement
    # with Box 4 is expected (spouse/child/other) or Self was contradicted.
    accept_any: [[E2, E3, E4], [E1, E3, E5], [E1, E3, E6]]
    require_strong_e4: false
    allowed_e6_types:
      - MULTI_ATTRIBUTE_IDENTITY_CONFIRMED
      - BOX2_INDEPENDENT_NAME_AUTHORITY
      - BOX2_BOX4_NAME_CONFIRMED
  patient_first:
    accept_any: [[E2, E3, E4], [E1, E3, E5], [E1, E3, E6]]
    allowed_e6_types:
      - MULTI_ATTRIBUTE_IDENTITY_CONFIRMED
  patient_last:
    accept_any: [[E2, E3, E4], [E1, E3, E5], [E1, E3, E6]]
    allowed_e6_types:
      - MULTI_ATTRIBUTE_IDENTITY_CONFIRMED
  cpt_hcpcs: {accept_any: [[E2, E3, E4], [E1, E3, E5], [E1, E3, E4, E7]]}
  procedure_code: {accept_any: [[E2, E3, E4], [E1, E3, E5], [E1, E3, E4, E7]]}
  total_charge:
    accept_any: [[E2, E3, E4], [E1, E3, E4], [E1, E3, E6]]
    require_strong_e4: true
    allowed_e6_types: [CLAIM_TOTAL_CONFIRMED, FINANCIAL_RECONCILIATION_VALID, LINE_TOTALS_RECONCILED, BOX28_LINE_SUM_CORROBORATED, FINANCIAL_GEOMETRY_ARITHMETIC_CONFIRMED, DERIVED_TOTAL_FROM_COMPLETE_VERIFIED_LINES]
  total_charges:
    accept_any: [[E2, E3, E4], [E1, E3, E4], [E1, E3, E6]]
    require_strong_e4: true
    allowed_e6_types: [CLAIM_TOTAL_CONFIRMED, FINANCIAL_RECONCILIATION_VALID, LINE_TOTALS_RECONCILED, BOX28_LINE_SUM_CORROBORATED, FINANCIAL_GEOMETRY_ARITHMETIC_CONFIRMED, DERIVED_TOTAL_FROM_COMPLETE_VERIFIED_LINES]
  patient_addr2: {accept_any: [[E1, E3, E4]]}
  insured_addr2: {accept_any: [[E1, E3, E4]]}
