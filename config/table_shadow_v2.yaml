policy_version: table-shadow-v2
mode: SHADOW
baseline_release: config/releases/extraction-v2.yaml
labels_path: evaluation_data/table_labels/approved_cell_labels.jsonl
label_manifest_path: evaluation_data/table_labels/cell_label_manifest.jsonl
artifact_root: evaluation_results/table_shadow_v2/artifacts
candidate_path: evaluation_results/table_shadow_v2/candidates.jsonl
promotion_enabled: false
critical_columns:
  - procedure_code
  - revenue_code
  - diagnosis_code
  - provider_npi
promotion_gates:
  table_detection_recall: 0.95
  structured_numeric_code_accuracy: 0.98
  row_column_alignment_accuracy: 0.99
  blank_cell_false_positive_rate: 0.005
  critical_false_accepts: 0
  minimum_incremental_recovery: 1
  provenance_completeness: 1.0
cms1500:
  template_version: 02-12
  table_type: CMS1500_SERVICE_LINES
  deterministic_detection:
    deskew: true
    clahe: true
    morphology: true
    template_grid_fallback: true
    evaluation_specific_coordinates: false
families:
  UB04:
    table_type: UB04_SERVICE_LINES
  laboratory_invoice:
    table_type: LABORATORY_RESULTS
  statement:
    table_type: STATEMENT_LINES
