# Prometheus scrape config for local/dev use (docker-compose network
# hostnames). In Kubernetes, prefer the `prometheus.io/scrape` pod
# annotations already set in each Helm chart's values.yaml (Prometheus
# Operator / kube-prometheus-stack picks these up automatically) --
# this static config is the docker-compose equivalent.
global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - alert_rules.yml

scrape_configs:
  - job_name: ingestion-api
    metrics_path: /metrics
    static_configs:
      - targets: ["ingestion-api:8000"]
        labels: {service: ingestion-api}

  - job_name: human-review-api
    metrics_path: /metrics
    static_configs:
      - targets: ["human-review-api:8001"]
        labels: {service: human-review-api}

  # document-preparation-worker has no HTTP server today (pure Kafka
  # consumer) -- it has nothing to scrape until a metrics-http-server
  # sidecar or `prometheus_client.start_http_server()` call is added.
  # Left here as the wiring point, not removed, so the gap is visible
  # rather than silently absent from this file.
  # - job_name: document-preparation-worker
  #   static_configs:
  #     - targets: ["document-preparation-worker:9100"]

  - job_name: redpanda
    metrics_path: /public_metrics
    static_configs:
      - targets: ["redpanda:9644"]
        labels: {service: redpanda}
