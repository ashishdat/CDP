# Field-cascade OCR strategy — operational CMS-1500 STP
#
# Version field-cascade-v12: last-20-run tool stack freeze on top of v11
# name/ID value-band FIRST + label-contamination conflict relief.
#
# Track-B learning from last 20 evaluation runs (~527 claims scanned):
# - total_charge dominates HITL (~295 blockers); EMPTY_FINANCIAL_INK is correct
#   fail-closed when box-28 and lines are blank — never invent STP.
# - Uncorroborated line sums unlock via gpt-4o crop + local OCR consensus
#   (SINGLE_LINE_GPT4O_LOCAL), not Azure DI charge crops or PP-OCRv5 Server.
# - patient_name HANDWRITING / CONFLICT resolved by gpt-4o crop residual.
# - PP-OCRv5 Server same paddle family; empty on hard residuals → leave off.
# - Azure DI charge residual thrash under F0 → default off.
#
version: field-cascade-v12
status: ACTIVE
phase: 12
supersedes: field-cascade-v11

# Declared tool stack (ops). Env flags may narrow, not broaden authority.
# Aligned to config/architecture/redesign_stack_v1.yaml capability table.
tool_stack:
  source: config/architecture/redesign_stack_v1.yaml
  image_preparation:
    technology: [OpenCV, Pillow, libtiff]
    status: PRODUCTION
  registration:
    technology: [SIFT, FLANN, RANSAC, LightGlue]
    status: PRODUCTION
  fixed_form_printed:
    technology: [OpenOCR, SVTRv2]
    env: CDP_OPENOCR_SVTR
    default: off
    fallback: [paddleocr, rapidocr]
  primary_ocr:
    engines: [paddleocr, rapidocr]
    role: Governed E2 confirmation (independent families). Also PP-OCRv5 optional.
  fill_ocr:
    engines: [tesseract, tesseract_digits]
    role: Fill on miss / single-engine charge cells before cloud residual.
  handwriting:
    technology: [TrOCR]
    role: DOB residual; names use gpt-4o arbitrator.
  complex_tables:
    technology: [PaddleOCR-VL, MonkeyOCR]
    env: [CDP_PADDLEOCR_VL_TABLE, CDP_MONKEYOCR]
    default: off
    authority: REVIEW_ONLY
  residual_handwriting:
    engine: azure_gpt4o_crop
    fields: [patient_name, insured_name, patient_dob]
    role: Name conflict arbitrator + DOB residual after local/TrOCR.
  residual_charge:
    engine: azure_gpt4o_crop
    role: >
      Empty box-28 line-sum corroboration (SINGLE_LINE_GPT4O_LOCAL /
      MULTI_LINE_GPT4O_LOCAL). Never gpt-4o-only monetary AUTO.
    monetary_authority: false
  cloud_document_ocr:
    technology: [Azure Document Intelligence, Textract]
    azure_di_charge_default: off
  validation:
    technology: [Pydantic, deterministic_rule_engine]
  calibration:
    technology: [Platt, Isotonic, LightGBM]
  workflow:
    technology: [FastAPI, Kafka, Redis, PostgreSQL]
  hitl_ui:
    technology: [React]
    runtime: apps/evaluation_ui/src/hitl.tsx
  azure_di_charge:
    default: off
    env: CDP_AZURE_DI_CHARGE_RESIDUAL
    role: Optional last-resort only; not on the recommended path.
  ppocr_v5_server:
    default: off
    env: CDP_PPOCRV5_SERVER
    role: Experimental paddle-family residual; not independent of paddleocr.
  empty_financial_ink:
    disposition: HITL_AFTER_MODEL
    residual: azure_gpt4o_crop
    env: CDP_GPT4O_EMPTY_FINANCE
    role: >
      Truly blank finance stays HITL only after gpt-4o expanded box-28 +
      service-line charge-cell sweep abstains. Never invent amounts.

# Pipeline stages (ops path). Later stages must not invent ink.
stages:
  - id: register
    role: Emit RegistrationReport / RegistrationEvidence (E3 source of truth).
  - id: register_recovery
    role: Cause-specific enhance then optional contrast-stretch second preprocess; same template/gates.
  - id: geometry
    role: Bind template ROIs; embed registration_ref + acceptance on GeometryResult.
  - id: roi_inset
    role: Shrink DOB/charge windows inside the safe cell (no re-registration).
  - id: dob_cells_first
    role: >
      For patient_dob, OCR inset MM/DD/YY cells with digit-whitelist tesseract
      before whole-band cascade — avoids dashed-rule "1" artifact at the source.
  - id: crop_ladder
    role: Typed crop variants ordered per field (digit-band, year-wide, NPI-cleared).
  - id: route_engines
    role: >
      Governed engines from ocr_field_routes.yaml. OCRRouter requires two usable
      OBSERVED engines (primary + confirmation) before short-circuit; fill
      (tesseract) only after confirmation ladder.
  - id: tesseract_fill
    role: >
      When paddle+rapid return usable but unshaped text, explicitly run tesseract
      on the same crop and re-pick — ensures fill engine is exercised and OBSERVED.
      For single-engine service-line charges, digit-whitelist tess runs before gpt-4o.
  - id: openocr_svtr_optional
    role: >
      FAILED STRATEGY — kept off (CDP_OPENOCR_SVTR=0). Same PADDLE_FAMILY and
      same bad charge windows; does not mint independent E2. Ruling-aware local
      dollars|cents crops + GPT corroboration replaced this step.
  - id: complex_tables_review
    role: >
      Optional PaddleOCR-VL / MonkeyOCR table structure (REVIEW_ONLY). Never
      monetary authority; geometric table path remains the production default.
  - id: engine_agreement
    role: >
      Among dual-engine candidates, prefer span-normalized multi-engine agreement;
      else first field-shaped value in route order. Never invent glyphs.
  - id: span_select
    role: Always span-select observed text before accept (even when OCR non-empty).
  - id: semantic_accept
    role: Stop only on field-shaped values (DATE / CURRENCY / NAME / ID).
  - id: post_miss
    role: Declared fallbacks after cascade miss (e.g. DOB cell OCR) — still observed ink only.
  - id: dob_separator_relief
    role: >
      When two calendar-valid DOBs differ only by leading-1 on MM/DD (rule artifact),
      prefer the copy without the extra 1 — even if confidence margin is large.
  - id: name_label_relief
    role: >
      Strip OCR-garbled CMS headers (1NSURED/FATIENT/FURST); reject label-shaped
      names; when engines disagree, prefer clean ink or longer token-prefix.
  - id: id_value_band_first
    role: Prefer id_value_band crop and shaped IDs over header-only OCR.
  - id: service_lines
    role: Probe service-line charges; skip header rows; currency can prove liveness.
  - id: charge_gpt4o_residual
    role: >
      gpt-4o crop on sparse / single-engine / digit-drop twin line cells with local
      priors — empty box-28 AUTO only via LINE_TOTALS_CORROBORATED.
  - id: empty_finance_gpt4o
    role: >
      When box-28 and service lines are empty after local OCR, gpt-4o sweeps
      charge-line cells (+ expanded box-28) and re-runs local OCR for consensus.
  - id: assemble
    role: ExtractionResult must reference registration + geometry + ocr artifacts.
  - id: complete_e3
    role: Attach TEMPLATE_REGISTRATION_CONFIRMED (E3) from RegistrationReport/Geometry.
  - id: completion_e6
    role: LINE_TOTALS_RECONCILED when box-28 empty + observed line charges (not invented).
  - id: decide
    role: True STP only when critical evidence classes are complete; else Track-B HITL.
  - id: acceptance_risk
    role: >
      Estimate HITL risk from evidence features (Platt/isotonic + optional LightGBM).
      GPT-only monetary candidates are forced high-risk (not monetary authority).
  - id: gap_taxonomy
    role: Classify residual ink gaps only after evidence-complete decision.
  - id: metrics
    role: >
      Report accuracy (UNAVAILABLE without GT), true STP, Track-A registration HITL,
      Track-B field-ink HITL, OCR cascade health, and the same rollups by_group / by_bundle.

honesty:
  - Never invent DOBs or amounts; empty / unreadable ink → HITL.
  - No identity-policy softening to chase STP rate.
  - Glyph repair only on observed confusables (e.g. I/00 → 100.00, 983 → 1983).
  - True STP = FinalClaim completed AND review_required=false.
  - Residual handwriting with header-only OCR stays HITL (scan/ROI / handwriting model / human).
  - Missing E3 / engine-authority strip is evidence-plumbing, never HANDWRITING_UNREADABLE.
  - DATE_VALID + HARD_VALIDATION may relieve calibrated floor; never waive E3.
  - Multi-engine ID agreement + HARD_VALIDATION may relieve C3 floor to 0.95 (corroboration).
  - DOB separator-1 peel only when both readings are calendar-valid and differ by that artifact.
  - Name label contamination is never NAME_SHAPED; CONFLICT relief only for clean⊆dirty or token-prefix.
  - Report registration HITL and field-ink HITL as separate tracks.
  - Hackathon 1000 has no field GT — accuracy status UNAVAILABLE_NO_GROUND_TRUTH.
  - gpt-4o never independently promotes critical charges (needs usable local consensus).
  - GPT-4o / VLM is residual semantic assistance — never sole monetary authority.
  - PP-OCRv5 Server is not an independence group vs paddleocr (PADDLE_FAMILY).
  - OpenOCR/SVTRv2 and MonkeyOCR stay CANDIDATE until domain holdout.

defaults:
  engine_source: config/ocr_field_routes.yaml
  stop_on: semantic_accept
  exhaust_action: keep_best_nonempty_or_empty
  always_span_select: true
  confirmation_required_usable: 1  # SELECTIVE_E2 via CDP_OCR_SELECTIVE_CONFIRM (default on)
  prefer_multi_engine_agreement: true
  gpt4o_crop_residual: true
  azure_di_charge_residual: false
  ppocr_v5_server: false
  e3_sources:
    - registration_report.json
    - document.json
    - geometry_field_registration

# Maps strategy ladder ids → CropVariant.variant_id produced by crop_variants().
crop_id_aliases:
  primary: primary
  dob_digit_band: dob_digit_band
  dob_loose: dob_loose
  dob_year_wide: dob_year_wide
  charge_npi_cleared: charge_npi_cleared
  charge_taller: charge_taller
  name_value_band: name_value_band
  id_value_band: id_value_band
  charges_primary: charges_primary
  charges_mid: charges_mid
  charges_right: charges_right
  charges_far_right: charges_far_right

fields:
  patient_dob:
    crop_ladder: [primary, dob_digit_band, dob_loose, dob_year_wide]
    accept: DATE_SHAPED
    post_miss: [dob_cells]
    prefer: cells_first
    notes: >
      Cells-first MM/DD/YY with digit-whitelist tesseract, then paddle/rapid.
      Handwriting residual is local TrOCR. Claude crop only after both miss,
      and only a date-shaped read. Azure DI is not on this path.
  insured_dob:
    crop_ladder: [primary, dob_digit_band, dob_loose, dob_year_wide]
    accept: DATE_SHAPED
    post_miss: [dob_cells]
    prefer: cells_first
    notes: >
      Box 11a insured DOB. Used with Box 3 under Self for independent DOB
      corroboration — never fused with service-date or signature-date crops.
  total_charge:
    crop_ladder: [primary, box28_tight, charge_taller, charge_npi_cleared]
    accept: CURRENCY_SHAPED
    reject: [CURRENCY_LEADING_MINUS, CURRENCY_SUSPICIOUS_TINY, EMPTY]
    completion: [LINE_TOTALS_RECONCILED]
    notes: >
      Box 28 is paddle/rapid, confirmed by digit-whitelist tesseract when it
      matches a local amount. Claude crop confirms a local line or box-28
      amount (SINGLE_LINE_GPT4O_LOCAL). Claude, tesseract, and Azure DI never
      straight-through a charge alone. A disagreeing box 28 stays HITL.
  patient_name:
    crop_ladder: [name_value_band, primary]
    accept: NAME_SHAPED
    notes: >
      v11: value-band FIRST (below printed Last/First header). Reject
      label-contaminated spans; relieve CONFLICT when one engine is header
      bleed and the other is clean ink, or when tokens are a strict prefix.
      gpt-4o crop is the conflict arbitrator and may replace garbage ink.
  insured_name:
    crop_ladder: [name_value_band, primary]
    accept: NAME_SHAPED
    notes: >
      Same as patient_name. OCR garble 1NSURED/FURST stripped before span;
      never NAME_SHAPED on header-only crops.
  insured_id_number:
    crop_ladder: [id_value_band, primary]
    accept: ID_SHAPED
    notes: >
      Value-band FIRST. Claude may break a same-length local digit conflict
      only when it matches one local read. It may not invent the ID.
  charges:
    crop_ladder: [charges_primary, charges_mid, charges_right, charges_far_right]
    accept: CURRENCY_SHAPED

# Residual HITL taxonomy (honest classification — not auto-accept paths).
gap_classes:
  EVIDENCE_PLUMBING_GAP:
    action: Fix artifact contracts (attach E3/E6 / engine authority); do not treat as ink failure.
  EVIDENCE_POLICY_GAP:
    action: Keep HITL until an allowed evidence path is actually present; do not relabel as unread ink.
  REGISTRATION_HITL:
    action: Registration recovery ladder or human registration; field cascade not applicable.
  HANDWRITING_UNREADABLE:
    action: Keep HITL; needs scan/ROI quality, handwriting model, or human entry.
  NAME_ENGINE_CONFLICT:
    action: gpt-4o crop residual to arbitrate local OCR name conflict; HITL if still unresolved.
  AMBIGUOUS_DIGIT_FRAGMENTS:
    action: Prefer crop/span repair; HITL if no unique calendar-valid date.
  DOB_SEPARATOR_ARTIFACT:
    action: Cells-first OCR + separator-1 peel; HITL only if both readings stay ambiguous.
  CALIBRATION_HITL:
    action: Calendar-valid / format-valid value held for calibrated confidence; corroboration relief or HITL.
  EMPTY_FINANCIAL_INK:
    action: >
      Run gpt-4o empty-finance residual (expanded box-28 crop + service-line
      charge-cell sweep with local corroboration). HITL only if the model
      abstains or finds no amount ink — never invent STP.
  LINE_SUM_UNCORROBORATED:
    action: >
      Box-28 empty but line charges observed — run gpt-4o crop on line cells for
      SINGLE_LINE_GPT4O_LOCAL / dual-engine corroboration; HITL if still single-engine.
  NPI_CONTAMINATED_CHARGE:
    action: Keep empty / HITL; never accept $1.00 NPI bleed as claim total.
