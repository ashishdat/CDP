    - Other Frequency 0 - Non Payment/Zero Claim 1 - Admit Through Discharge Claim
    2 - Interim - First Claim 3 - Interim - Continuing Claim 4 - Interim - Last Claim
    5 - Late Charges(s) Only 6 - Adjustment of Prior Claim 7 - Replacement of Prior
    Claim 8 - Void/Cancel of Prior Claim Definitions: 0 - Non Payment/Zero Claim -
    Used when a bill is submitted to inform the payer of the non-reimbursement periods
    of confinement or termination of care; the provider does not anticipate payment.
    1 - Admit Through Discharge Claim - Used for a bill which is expected to be the
    only bill for a course of treatment of inpatient confinement. 2 - Interim - First
    Claim - Used for the first of a series of bills to the same third party payer
    for the same confinement or course of treatment. 3 - Interim - Continuing Claim
    - Used when a bill for the same confinement/course of treatment was previously
    submitted and it is expected that further bills for the same confinement/course
    of treatment will be submitted. 4 - Interim - Last Claim - Used for the last of
    a series of bills, for which payment is expected, to the same third party payer
    for the same confinement or course of treatment. 5 - Late Charge(s) Only - Used
    for submitting charges that were received by the provider after the Admit Through
    Discharge or the Last Interim Claim has been submitted. 6 - Adjustment of Prior
    Claim - Used when a bill previously issued for a specific provider, patient, payer,
    insured and “Statement Covers Period” date and the reimbursement amount is to
    be recalculated due to an increase or decrease in charges, per diem calculations,
    deductibles, co- insurance, and/or prior third party payments. To properly adjust
    a prior bill, the respective plus or minus adjustment must be provided, along
    with the net overall charge and the new reimbursement amount. When a revenue code
    line is to be changed, the provider is to operate on the principle that the change
    is to be added to information already submitted (new charge line is unsigned)
    or is to be subtracted from information already submitted (new charge line is
    a credit). This code is not to be used in lieu of a Late Charge(s) Only Claim.
    Note: This code is not currently acceptable. 7 - Replacement of Prior Claim -
    Used when a previously issued bill needs to be restated in its entirely, except
    for the same identify information. With this code, the payer is to operate on
    the principal that the original bill is null and void, and that the information
    on this bill represents a complete replacement of the previously issued bill.
    8 - Void/Cancel of Prior Claim - code reflects the elimination in its entirety
    of previously submitted bill. The provider may wish to follow a Void Bill with
    a bill containing the correct information when a Payer is unable to process a
    Replacement to a Prior Claim. The appropriate Frequency Code must be used when
    submitting the new bill. The void bill must contain the same claim suffix and
    charges as the paid claim. Batch/Claim Type Inpatient/Outpatient Definitions 1XX
