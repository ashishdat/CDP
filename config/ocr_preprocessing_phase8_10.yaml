version: "2.0-phase8.10-evaluation"
default_profile: GENERAL_TEXT
profiles:
  GENERAL_TEXT: [safe_border, grayscale]
  DIGIT_PRESERVING_V2: [safe_border, grayscale, clahe, upscale_2x, mild_contrast]
  NAME_STROKE_V2: [safe_border, grayscale, upscale_2x, mild_contrast, edge_preserving_denoise]
  DATE_DELIMITER_V2: [safe_border, grayscale, clahe, upscale_2x, mild_contrast]
  CURRENCY_DECIMAL_V2: [safe_border, grayscale, upscale_2x, mild_contrast]
  ALPHANUMERIC_STROKE_V2: [safe_border, grayscale, upscale_2x, mild_contrast, character_sharpen]
field_rules:
  # Specialized profiles only where crop probes beat REGIONAL_DEFAULT.
  # Names / free text / member IDs / service dates intentionally unmatched → REGIONAL_DEFAULT.
  # DATE_DELIMITER_V2 is DOB-only: service_date crops regressed under that profile.
  # NAME_STROKE_V2 remains defined for explicit override / recovery experiments only.
  - {profile: DIGIT_PRESERVING_V2, contains: [provider_npi, npi, federal_tax_no, tax_id]}
  # DATE_DELIMITER_V2 left defined for experiments; DOB cascade digit-band already
  # recovers MM/DD/YYYY without this profile (Phase 2 smoke: preprocess flipped 10/29→11/29).
  # - {profile: DATE_DELIMITER_V2, contains: [patient_dob, dob]}
  - {profile: CURRENCY_DECIMAL_V2, contains: [total_charge, charge_amount, charges, currency]}
  # CPT/HCPCS only — ICD letter categories (I10) regress under stroke sharpening.
  - {profile: ALPHANUMERIC_STROKE_V2, contains: [cpt, hcpcs]}
