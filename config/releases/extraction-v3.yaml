known_limitations:
- Candidate only: not FROZEN until promotion gates pass with verified hashes and holdout
    evidence.
- Charge-line false-accept (FA) gates still require validation; no production FA claim
  is made here.
- "Truly empty box-28 with no observed line charges stays HITL \xE2\u20AC\u201D never\
  \ invent charge totals."
- CMS-1500 ROIs are V3 recalibrations; operators must pin CDP_RELEASE_MANIFEST / CDP_PIPELINE_RELEASE
  explicitly.
- Authorized member/provider/address datasets are not configured.
- Generic TrOCR handwriting output is non-authoritative; Claude crop is the preferred
  residual for names/charges.
- Azure DI charge residual is enabled for authorized PRODUCT recovery; PP-OCRv5 Server remains disabled.
- Docling remains a disabled additive pilot.
- Baseline metrics are intentionally unset until governed evaluation completes; do
  not treat nulls as zeros.
