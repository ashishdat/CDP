# `replicaCount` is only the starting point -- once the companion KEDA
# ScaledObject (deploy/keda/document-preparation-worker-scaledobject.yaml)
# targets this Deployment, KEDA owns `spec.replicas` based on
# `document.received` consumer-group lag, scaling down to
# `minReplicaCount` (including 0) when the topic is idle.
replicaCount: 1

image:
  repository: idp-claims-platform-document-preparation-worker
  tag: latest
  pullPolicy: IfNotPresent

command: ["python", "-m", "workers.document_preparation.consumer"]

resources:
  requests:
    cpu: 500m
    memory: 512Mi
  limits:
    cpu: 2000m
    memory: 1Gi

env:
  PIPELINE_VERSION: "0.1.0"
  SCHEMA_VERSION: "1.0"
  OBJECT_STORE_BUCKET: "idp-documents"
  OBJECT_STORE_USE_SSL: "false"
  USE_IN_MEMORY_BUS: "false"

# See ingestion-api's values.yaml comment -- same convention.
secretName: idp-document-preparation-worker-secrets

serviceAccount:
  create: true
  name: ""

# No HTTP server in this worker -- no liveness/readiness probes. A
# production deployment would add a lightweight health signal (e.g. a
# sidecar exposing consumer-loop liveness, or a periodically-touched file
# checked via an exec probe) before relying on this in a real cluster.
podAnnotations: {}
